<!DOCTYPE html>
<!--
  汉字练习连线游戏 — Chinese Matching Game

-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>汉字连线练习 Chinese Matching Game</title>
  <!-- Nintendo Switch kid-friendly style -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Nintendo Switch palette */
      --sw-red:    #E4000F;   /* Joy-Con left red */
      --sw-blue:   #0AB9E6;   /* Joy-Con right blue */
      --sw-orange: #FF8200;   /* accent / highlight */
      --sw-dark:   #1A1A2E;   /* near-black UI chrome */
      --sw-panel:  #F0F0F5;   /* screen panel bg */
      --sw-white:  #FFFFFF;

      --correct: #39D353;
      --wrong:   #E4000F;
      --card-bg: #FFFFFF;
      --radius:  20px;
      --shadow:  0 6px 0px rgba(0,0,0,.22), 0 2px 14px rgba(0,0,0,.14);
      --font-zh: 'Noto Serif SC', 'KaiTi', 'STKaiti', serif;
      --font-en: 'Nunito', 'Segoe UI', sans-serif;
    }

    /* ── Warm peach background with subtle dots ── */
    body {
      font-family: var(--font-en);
      background-color: #fcb69f;
      background-image:
        linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%),
        radial-gradient(circle, rgba(255,255,255,.25) 1px, transparent 1px);
      background-size: 100% 100%, 26px 26px;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 16px 4px;
      gap: 5px;
      user-select: none;
    }

    /* ── Joy-Con rail strip at top & bottom ── */
    body::before, body::after {
      content: '';
      position: fixed; left: 0; right: 0; height: 10px; z-index: 1000;
      background: linear-gradient(90deg, var(--sw-red) 0%, var(--sw-red) 48%,
                  var(--sw-dark) 48%, var(--sw-dark) 52%,
                  var(--sw-blue) 52%, var(--sw-blue) 100%);
    }
    body::before { top: 0; border-radius: 0 0 6px 6px; }
    body::after  { bottom: 0; border-radius: 6px 6px 0 0; }

    /* ── Top bar ── */
    .top-bar {
      width: 100%; max-width: 920px;
      display: flex; flex-direction: column; gap: 4px; flex-shrink: 0;
      background: rgba(255,255,255,.55);
      border-radius: 16px; padding: 5px 12px;
      border: 2px solid rgba(255,255,255,.7);
      backdrop-filter: blur(2px);
      margin-top: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,.10);
    }
    .top-row1 { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .top-row2 { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }

    header { text-align: center; }
    header h1 {
      font-size: clamp(.95rem, 2.4vw, 1.3rem);
      color: #4a2c00;
      font-family: var(--font-zh);
      letter-spacing: .06em;
      text-shadow: 1px 2px 3px rgba(0,0,0,.12);
      white-space: nowrap;
      font-weight: 700;
    }

    /* ── Buttons — chunky Joy-Con pill style ── */
    .controls { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .btn {
      padding: 7px 18px; border: none; border-radius: 50px;
      font-size: .9rem; font-weight: 900; cursor: pointer; font-family: var(--font-en);
      letter-spacing: .03em;
      transition: transform .1s, box-shadow .1s, filter .1s;
      box-shadow: 0 2px 6px rgba(0,0,0,.18);
      position: relative; top: 0;
    }
    .btn:active {
      transform: scale(.95);
      box-shadow: 0 1px 3px rgba(0,0,0,.18);
      top: 0;
    }
    /* Switch-style button bounce */
    .btn:hover { filter: brightness(1.12); }
    .btn-primary { background: var(--sw-red);    color: #fff; }
    .btn-accent  { background: var(--sw-blue);   color: #fff; }
    .btn-neutral { background: #4A4A6A;           color: #ddd; }
    .btn-switch  { background: var(--sw-orange);  color: #fff; }

    /* ── Celebration toggle ── */
    .celeb-toggle-wrap {
      display: flex; align-items: center; gap: 6px;
      font-size: .8rem; font-weight: 800; color: #4a2c00;
      background: rgba(255,255,255,.65); padding: 4px 10px 4px 8px; border-radius: 50px;
      border: 2px solid rgba(255,255,255,.8);
      cursor: pointer; user-select: none;
      white-space: nowrap;
    }
    .sound-toggle-wrap {
      display: flex; align-items: center; gap: 6px;
      font-size: .8rem; font-weight: 800; color: #4a2c00;
      background: rgba(255,255,255,.65); padding: 4px 10px 4px 8px; border-radius: 50px;
      border: 2px solid rgba(255,255,255,.8);
      cursor: pointer; user-select: none;
      white-space: nowrap;
    }
    /* ── Digital clock timer ── */
    .clock-display {
      font-family: 'Courier New', 'Lucida Console', monospace;
      font-size: 1rem; font-weight: 900;
      letter-spacing: .08em;
      color: #4a2c00;
      background: rgba(255,255,255,.75);
      padding: 3px 12px;
      border-radius: 50px;
      border: 2px solid rgba(255,255,255,.85);
      cursor: pointer;
      user-select: none;
      min-width: 62px;
      text-align: center;
      transition: color .2s, background .2s, border-color .2s;
      box-shadow: 0 2px 8px rgba(0,0,0,.10);
    }
    .clock-display.ticking { color: #1a8a2a; border-color: rgba(57,211,83,.5); }
    .clock-display.muted   { color: #aaa;    border-color: rgba(0,0,0,.10); }
    .toggle-track {
      width: 36px; height: 20px; border-radius: 10px;
      background: #bbb; position: relative; transition: background .22s;
      flex-shrink: 0;
    }
    .toggle-track.on { background: var(--correct); }
    .toggle-thumb {
      position: absolute; top: 2px; left: 2px;
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.28);
      transition: left .22s;
      will-change: left;
    }
    .toggle-track.on .toggle-thumb { left: 18px; }

    /* ── Scoreboard ── */
    .scoreboard {
      display: flex; gap: 12px; font-size: .9rem; font-weight: 800;
      color: #4a2c00;
      background: rgba(255,255,255,.65); padding: 4px 14px; border-radius: 50px;
      border: 2px solid rgba(255,255,255,.8);
      backdrop-filter: blur(4px);
    }
    .scoreboard span { display: flex; align-items: center; gap: 4px; }

    .round-info { font-size: .9rem; font-weight: 700; color: #7a4500; text-align: center; }

    /* ── Game wrapper (Switch "screen" panel) ── */
    .game-wrapper {
      position: relative; width: 100%; max-width: 920px;
      flex: 1; min-height: 0; touch-action: none;
    }
    #line-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; overflow: visible; z-index: 10;
    }

    /* ── Columns ── */
    .columns {
      display: flex; justify-content: space-between; align-items: stretch;
      gap: 52px; width: 100%; height: 100%; position: relative; z-index: 1;
      padding: 10px;
    }
    .col { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; height: 100%; }

    /* ── Cards — thick border "game cartridge" feel ── */
    .match-card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      padding: 3px 10px;
      cursor: pointer;
      border: 3px solid transparent;
      transition: border-color .13s, transform .12s, box-shadow .12s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      will-change: transform;
    }
    .match-card.left-card:hover  {
      transform: translateX(5px) scale(1.02);
      box-shadow: 0 6px 20px rgba(0,0,0,.15);
      border-color: var(--sw-blue);
    }
    .match-card.right-card:hover {
      transform: translateX(-5px) scale(1.02);
      box-shadow: 0 6px 20px rgba(0,0,0,.15);
      border-color: var(--sw-red);
    }
    .match-card.selected {
      border-color: var(--sw-orange);
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      outline: 3px solid rgba(255,130,0,.65);
      outline-offset: 1px;
      animation: selectedPulse 1.1s ease-in-out infinite;
    }
    .match-card.left-card.selected  { transform: translateX(5px) scale(1.03); }
    .match-card.right-card.selected { transform: translateX(-5px) scale(1.03); }
    .match-card.matched {
      border-color: var(--correct);
      background: linear-gradient(135deg, #e8fff0, #d0f5dc);
      box-shadow: 0 4px 14px rgba(57,211,83,.2);
      pointer-events: none;
    }
    .match-card.wrong { border-color: #222; animation: shake .35s; }

    /* ── Card inner layout ── */
    .card-row { display: flex; align-items: center; gap: 8px; width: 100%; }
    .card-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; overflow: hidden; }
    .card-pinyin  { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; font-weight: 400; font-size: clamp(.75rem, 1.9vh, 1.2rem); color: #888; letter-spacing: .04em; text-align: center; line-height: 1.1; }
    .card-chinese {
      font-family: var(--font-zh);
      font-size: clamp(1.1rem, 3.2vh, 2.2rem);
      color: #2c1000;
      font-weight: 700;
      text-align: center;
      line-height: 1.15;
    }
    .card-img {
      width: auto; height: min(7vh, 62px); max-width: 100%;
      object-fit: contain; display: block;
      filter: drop-shadow(1px 2px 3px rgba(0,0,0,.12));
    }
    .img-error { font-size: .7rem; color: #bbb; text-align: center; padding: 6px; }

    /* ── Dot anchors — Joy-Con button style ── */
    .dot-right, .dot-left {
      display: inline-block; width: 12px; height: 12px;
      border-radius: 50%;
      background: #ccc;
      border: 2px solid #aaa;
      flex-shrink: 0;
    }

    /* ── Lines ── */
    .connector-line { stroke-linecap: round; fill: none; stroke-width: 4; filter: drop-shadow(1px 2px 3px rgba(0,0,0,.25)); }
    .line-pending { stroke: var(--sw-orange); stroke-dasharray: 8 5; stroke-width: 3; }
    .line-correct { stroke: var(--correct); stroke-width: 4.5; }
    .line-wrong   { stroke: #444; stroke-width: 4.5; stroke-dasharray: 7 4; }

    /* ── Progress bar ── */
    .progress-wrap {
      width: 100%; max-width: 920px;
      background: rgba(255,255,255,.45);
      border-radius: 50px; height: 7px; flex-shrink: 0; overflow: hidden;
      border: 1.5px solid rgba(255,255,255,.6);
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--sw-orange), #f4845f, var(--sw-blue));
      border-radius: 50px;
      transition: width .4s cubic-bezier(.34,1.56,.64,1);
    }

    /* ── Level badge — rounded pill ── */
    .level-badge {
      font-size: .9rem; font-weight: 900; padding: 5px 16px; border-radius: 50px;
      letter-spacing: .03em;
      box-shadow: 0 2px 6px rgba(0,0,0,.15);
      transition: background .4s, color .4s; white-space: nowrap;
      border: 2px solid rgba(255,255,255,.3);
      font-family: var(--font-en);
    }
    .level-badge.lv1  { background: #39D353; color: #fff; }
    .level-badge.lv2  { background: #FF8200; color: #fff; }
    .level-badge.lv3  { background: #E4000F; color: #fff; }
    .level-badge.lv4  { background: #9B59B6; color: #fff; }
    .level-badge.lv5  { background: #0AB9E6; color: #fff; }
    .level-badge.lv6  { background: #FF8C00; color: #fff; }
    .level-badge.lv7  { background: #1E90FF; color: #fff; }
    .level-badge.lv8  { background: #FF69B4; color: #fff; }
    .level-badge.lv9  { background: #2ECC71; color: #fff; }
    .level-badge.lv10 { background: #F39C12; color: #fff; }
    .level-badge.lv11 { background: #8E44AD; color: #fff; }

    /* ── Feedback popup ── */
    .feedback {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%,-50%) scale(.6);
      background: #fff;
      border-radius: 28px;
      padding: 20px 32px; text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,.18);
      z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      cursor: pointer;
      border: 2px solid rgba(244,132,95,.25);
      width: 270px;
      min-height: 210px;
    }
    .feedback.show { display: flex; animation: popIn .55s cubic-bezier(.22,.68,0,1.2) forwards; }
    .feedback .emoji { font-size: 3.5rem; animation: wobble 1.0s ease; }
    .fb-stroke-img {
      width: 100px; height: clamp(48px, 10vh, 80px);
      object-fit: contain;
      filter: drop-shadow(1px 2px 4px rgba(0,0,0,.15));
      animation: wobble 1.0s ease;
    }
    .fb-stroke-name {
      font-family: var(--font-zh);
      font-size: 1.15rem;
      font-weight: 700;
      color: #4a2c00;
      letter-spacing: .04em;
      text-align: center;
      line-height: 1.3;
    }
    .fb-stroke-name .fb-pinyin {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      font-weight: 400;
      font-size: .95rem;
      color: #888;
    }
    .feedback .msg   { font-size: 1.2rem; font-weight: 600; color: #4a2c00; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    .feedback .sub   { font-size: .95rem; color: #7a4500; font-weight: 400; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    .feedback .sub.zh-phrase { font-family: var(--font-zh); font-size: 1.2rem; font-weight: 700; color: #4a2c00; letter-spacing: .06em; }

    /* ── Complete overlay ── */
    .complete-overlay {
      position: fixed; inset: 0;
      background: rgba(120,60,20,.45);
      backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; z-index: 200;
    }
    .complete-overlay.show { display: flex; animation: fadeInOverlay .25s ease; }
    .complete-box {
      background: #fff;
      border-radius: 28px; padding: 28px 36px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.20);
      max-width: 440px; width: 88%;
      border: 2px solid rgba(244,132,95,.25);
      animation: boxPopIn .35s cubic-bezier(.22,.68,0,1.36) forwards;
    }
    .complete-box .big-emoji { font-size: 3.8rem; margin-bottom: 8px; animation: bounce 0.6s ease; }
    .complete-box h2 {
      font-size: 1.6rem; color: #4a2c00; margin-bottom: 6px;
      font-family: var(--font-zh); font-weight: 900;
    }
    .complete-box .stats { font-size: .95rem; color: #7a4500; margin-bottom: 16px; font-weight: 700; }
    .stars { font-size: 2rem; margin-bottom: 6px; letter-spacing: 4px; }

    /* ── Game Selector overlay ── */
    .selector-overlay {
      position: fixed; inset: 0; background: rgba(120,60,20,.45);
      backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; z-index: 300;
    }
    .selector-overlay.show { display: flex; }
    .selector-box {
      background: #fff; border-radius: 26px; padding: 24px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.18);
      max-width: 520px; width: 90%;
      max-height: 88vh; overflow-y: auto;
      border: 2px solid rgba(10,185,230,.2);
      animation: boxPopIn .3s cubic-bezier(.22,.68,0,1.36) forwards;
    }
    .selector-box h2 {
      font-size: 1.5rem; color: #4a2c00; margin-bottom: 6px;
      font-family: var(--font-zh); text-align: center; font-weight: 900;
    }
    .selector-box p.sub { font-size: .9rem; color: #666; text-align: center; margin-bottom: 16px; font-weight: 700; }
    .pack-list { display: flex; flex-direction: column; gap: 10px; }
    .pack-item {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 16px; border-radius: 18px; border: 3px solid #E0E0F0;
      cursor: pointer; transition: border-color .13s, background .13s, transform .1s;
      background: #F7F7FF;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .pack-item:hover  { border-color: var(--sw-blue); background: #eaf8fd; transform: scale(1.01); }
    .pack-item.active-pack { border-color: var(--correct); background: #e8fff0; }
    .pack-icon { font-size: 2.2rem; flex-shrink: 0; }
    .pack-info { flex: 1; }
    .pack-name  { font-size: 1.05rem; font-weight: 900; color: #4a2c00; }
    .pack-desc  { font-size: .84rem; color: #666; margin-top: 2px; font-weight: 700; }
    .pack-levels{ font-size: .76rem; color: #aaa; margin-top: 2px; font-weight: 700; }
    .selector-close {
      margin-top: 18px; width: 100%; padding: 13px; border: none;
      border-radius: 50px; background: var(--sw-red); color: #fff;
      font-size: 1.05rem; font-weight: 900; cursor: pointer; font-family: var(--font-en);
      box-shadow: 0 2px 6px rgba(0,0,0,.18);
      transition: transform .1s, box-shadow .1s;
    }
    .selector-close:active { transform: scale(.96); box-shadow: 0 1px 3px rgba(0,0,0,.18); }

    /* ── Attribution ── */
    .attribution {
      width: 100%; max-width: 920px; flex-shrink: 0;
      text-align: center; font-size: .72rem; color: #8a5c2e;
      background: rgba(255,255,255,.40); border-radius: 10px; padding: 4px 12px; line-height: 1.6;
    }
    .attribution a { color: #7a4500; text-decoration: underline; text-decoration-style: dotted; }
    .attribution a:hover { color: var(--sw-red); }
    .attr-own  { display: block; font-weight: 700; color: #5a3800; }
    .attr-img  { display: block; color: #8a5c2e; }

    /* ── Animations ── */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-7px) rotate(-2deg); }
      40%      { transform: translateX(7px)  rotate(2deg); }
      60%      { transform: translateX(-5px) rotate(-1deg); }
      80%      { transform: translateX(5px)  rotate(1deg); }
    }
    @keyframes popIn {
      from { transform: translate(-50%,-50%) scale(.5) rotate(-4deg); opacity: 0; }
      to   { transform: translate(-50%,-50%) scale(1)  rotate(0deg);  opacity: 1; }
    }
    @keyframes boxPopIn {
      from { transform: scale(.6) rotate(-3deg); opacity: 0; }
      to   { transform: scale(1)  rotate(0deg);  opacity: 1; }
    }
    @keyframes wobble {
      0%   { transform: rotate(0deg) scale(1); }
      25%  { transform: rotate(-7deg) scale(1.09); }
      50%  { transform: rotate(6deg) scale(1.06); }
      75%  { transform: rotate(-3deg) scale(1.03); }
      100% { transform: rotate(0deg) scale(1); }
    }
    @keyframes bounce {
      0%   { transform: translateY(0); }
      40%  { transform: translateY(-18px); }
      70%  { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }
    @keyframes fadeInOverlay {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes selectedPulse {
      0%, 100% { outline-offset: 1px;  outline-color: rgba(255,130,0,.55); }
      50%       { outline-offset: 4px;  outline-color: rgba(255,130,0,.90); }
    }
    @keyframes lineFlash {
      0%   { stroke-opacity: 1; }
      50%  { stroke-opacity: .2; }
      100% { stroke-opacity: 1; }
    }
    .line-flash { animation: lineFlash .4s ease 2; }

    @keyframes coinFly {
      0%   { transform: translateY(0) translateX(0) rotate(0deg) scale(1.6); opacity: 1; }
      30%  { opacity: 1; }
      70%  { opacity: .85; }
      100% { transform: translateY(-180px) translateX(var(--cdx, 0px)) rotate(var(--crot, 360deg)) scale(.35); opacity: 0; }
    }
    @keyframes sparkFly {
      0%   { transform: translate(0,0) scale(2.2) rotate(0deg); opacity: 1; }
      55%  { opacity: .95; }
      100% { transform: translate(var(--sdx), var(--sdy)) scale(0) rotate(var(--srot, 180deg)); opacity: 0; }
    }
    .coin-particle {
      position: fixed; pointer-events: none; z-index: 9999;
      font-size: 1.8rem; animation: coinFly 1.6s cubic-bezier(.22,.68,0,.98) forwards;
      will-change: transform, opacity;
    }
    .spark-particle {
      position: fixed; pointer-events: none; z-index: 9998;
      animation: sparkFly 1.4s ease-out forwards;
      will-change: transform, opacity;
    }
    .fb-timer {
      font-size: .78rem; color: #888;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      font-weight: 400; background: rgba(0,0,0,.06);
      padding: 2px 10px; border-radius: 50px;
    }
    .level-complete-bar {
      text-align: center; font-size: .88rem; font-weight: 800; color: #4a2c00;
      background: linear-gradient(90deg, rgba(57,211,83,.15), rgba(255,130,0,.12), rgba(10,185,230,.15));
      border-radius: 50px; padding: 3px 14px;
      animation: fadeInOverlay .3s ease;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      body::before, body::after { height: 6px; }
      body         { padding: 4px 6px 3px; gap: 3px; }
      .top-bar     { gap: 3px; padding: 4px 8px; border-radius: 14px; margin-top: 3px; }
      .top-row1, .top-row2 { gap: 5px; }
      /* collapse both rows tighter */
      .top-row1    { flex-wrap: nowrap; justify-content: space-between; }
      .top-row2    { flex-wrap: nowrap; justify-content: center; }

      .match-card  { padding: 2px 5px; border-radius: 12px; }
      .card-pinyin { font-size: clamp(.6rem, 1.6vh, .95rem); }
      .card-chinese { font-size: clamp(.88rem, 2.7vh, 1.7rem); }
      .card-img    { height: min(5.5vh, 44px); }
      /* controls: no wrap, emoji-only buttons */
      .controls    { flex-wrap: nowrap; gap: 4px; }
      .btn         { padding: 5px 10px; font-size: .78rem; }
      .btn-label   { font-size: 0; }
      .btn-label::before { content: attr(data-short); font-size: 1.1rem; line-height: 1; }
      .level-badge { font-size: .68rem; padding: 3px 8px; }
      .scoreboard  { font-size: .75rem; padding: 3px 8px; gap: 5px; }
      /* hide long round-info text on phone */
      .round-info  { display: none; }
      /* thinner progress bar */
      .progress-wrap { height: 6px; }
      header h1    { font-size: clamp(.78rem, 3vw, 1rem); white-space: normal; }
      .complete-box { padding: 18px 16px; border-radius: 20px; }
      .selector-box { padding: 16px 12px; }
    }
  </style>
</head>

/* ═══════════════════════════════════════════════════════════════
   AUDIO ENGINE  (Web Audio API — no files, no external service)
═══════════════════════════════════════════════════════════════ */
const _AudioCtx = window.AudioContext || window.webkitAudioContext;
let _actx = null;

function _getCtx() {
  if (!_actx) _actx = new _AudioCtx();
  if (_actx.state === 'suspended') _actx.resume();
  return _actx;
}

// Schedule a single tone: osc type, frequency, start time, duration, peak volume
function _tone(ctx, dest, type, freq, t, dur, vol) {
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain);
  gain.connect(dest);
  osc.start(t);
  osc.stop(t + dur + 0.05);
}

// ✅ Correct match — warm ascending marimba chime (C5 → E5 → G5)
function playCorrect() {
  if (!soundOn) return;
  const ctx    = _getCtx();
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.22, ctx.currentTime);
  master.connect(ctx.destination);
  const t = ctx.currentTime;
  _tone(ctx, master, 'triangle', 523.25, t,        0.38, 1.0);
  _tone(ctx, master, 'triangle', 659.25, t + 0.11, 0.33, 1.0);
  _tone(ctx, master, 'triangle', 783.99, t + 0.22, 0.42, 1.0);
  // Soft high shimmer on the last note
  _tone(ctx, master, 'sine',    1046.50, t + 0.22, 0.28, 0.28);
}

// ❌ Wrong match — two sawtooth "mm-mm" buzzes, descending pitch each pulse
function playWrong() {
  if (!soundOn) return;
  const ctx    = _getCtx();
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.18, ctx.currentTime);
  master.connect(ctx.destination);
  const t = ctx.currentTime;

  // Two buzz pulses: higher then lower, like "mm-mm / nuh-uh"
  [{ startF: 240, endF: 180, start: 0 },
   { startF: 190, endF: 130, start: 0.23 }].forEach(({ startF, endF, start }) => {
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(startF, t + start);
    osc.frequency.exponentialRampToValueAtTime(endF, t + start + 0.18);
    gain.gain.setValueAtTime(0, t + start);
    gain.gain.linearRampToValueAtTime(1, t + start + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + start + 0.20);
    osc.connect(gain);
    gain.connect(master);
    osc.start(t + start);
    osc.stop(t + start + 0.25);
  });
}

// 🎉 Level complete — C major fanfare arpeggio then chord sustain
function playComplete() {
  if (!soundOn) return;
  const ctx    = _getCtx();
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.18, ctx.currentTime);
  master.connect(ctx.destination);
  const t = ctx.currentTime;
  // Quick arpeggio: C5 E5 G5 C6
  [523.25, 659.25, 783.99, 1046.50].forEach((f, i) =>
    _tone(ctx, master, 'triangle', f, t + i * 0.10, 0.50, 1.0)
  );
  // Warm chord sustain underneath
  [523.25, 659.25, 783.99].forEach(f =>
    _tone(ctx, master, 'sine', f, t + 0.42, 0.65, 0.45)
  );
}

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('sound-track').classList.toggle('on', soundOn);
  // Unlock AudioContext on first interaction (required by iOS/Chrome policy)
  if (soundOn) _getCtx();
}

let _tickInterval  = null;
let _tickMuted     = false;   // clock visible but tick sound silenced
let _tickStarted   = false;   // becomes true after first card tap

function playTick() {
  if (!soundOn || _tickMuted) return;
  const ctx  = _getCtx();
  const t    = ctx.currentTime;
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(1200, t);
  osc.frequency.exponentialRampToValueAtTime(800, t + 0.025);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.18, t + 0.004);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t);
  osc.stop(t + 0.05);
}

function _updateClock() {
  const el = document.getElementById('clock-display');
  if (!el) return;
  const secs = Math.floor((Date.now() - levelStartTime) / 1000);
  el.textContent = secs + 's';
}

function startTick() {
  stopTick();
  _tickStarted = true;
  levelStartTime = Date.now();
  const el = document.getElementById('clock-display');
  if (el) { el.classList.remove('muted'); el.classList.add('ticking'); }
  _updateClock();
  playTick();
  _tickInterval = setInterval(() => { _updateClock(); playTick(); }, 1000);
}

function stopTick() {
  if (_tickInterval) { clearInterval(_tickInterval); _tickInterval = null; }
  _tickStarted = false;
  const el = document.getElementById('clock-display');
  if (el) { el.classList.remove('ticking'); el.classList.add('muted'); }
}

// Clock widget click — toggle tick mute while keeping clock running
function toggleTickMute() {
  if (!_tickStarted) return;  // clock not active yet, nothing to toggle
  _tickMuted = !_tickMuted;
  const el = document.getElementById('clock-display');
  if (el) el.classList.toggle('muted', _tickMuted);
}

/* ═══════════════════════════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════════════════════════ */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getDotCenter(el) {
  const wrapper = document.getElementById('game-wrapper');
  const wr = wrapper.getBoundingClientRect();
  const er = el.getBoundingClientRect();
  return { x: er.left + er.width / 2 - wr.left, y: er.top + er.height / 2 - wr.top };
}

/* Coin + spark burst when a pair is correctly matched.
   Particles are appended to body and removed ONLY via animationend —
   they are never cancelled by user interaction. */
/* Spawn particles from the left and right card positions, biased outward to
   each side so they never cross the center where the feedback popup sits. */
function spawnCoins(lx, ly, rx, ry, celebEmoji = '🎉') {
  const coinPool  = isIOS ? ['⭐', '🌟'] : ['🪙', '💰'];
  const sparkPool = isIOS ? ['✨', '🌟', '⭐', '🌟', '✨', '⭐']
                          : ['✨', '🌟', '🪙', '💰', '✨', '🌟'];

  // Helper: spawn one arc particle from (ox,oy) biased toward xDir (-1=left, +1=right)
  function arc(ox, oy, emoji, cls, xDir, fs, dur, del, extraCss = '') {
    const el = document.createElement('div');
    el.className = cls;
    el.textContent = emoji;
    const cdx  = (xDir * (50 + Math.random() * 90)).toFixed(1);  // always fly outward
    const crot = (Math.random() * 60 - 30).toFixed(0);
    const jx   = (Math.random() - .5) * 30;
    const jy   = (Math.random() - .5) * 30;
    el.style.cssText =
      `left:${ox + jx - 16}px; top:${oy + jy - 16}px;` +
      `animation-duration:${dur}ms; animation-delay:${del}ms;` +
      `--cdx:${cdx}px; --crot:${crot}deg; font-size:${fs}rem;` + extraCss;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  // Helper: spawn one radial spark from (ox,oy) biased to the outer half
  function spark(ox, oy, emoji, xDir, fs, dur, del) {
    const el = document.createElement('div');
    el.className = 'spark-particle';
    el.textContent = emoji;
    // angles in the outer 180° hemisphere (away from center)
    const baseAngle = xDir < 0 ? 90 : 270;  // left side → 90°±, right → 270°±
    const angle = baseAngle + (Math.random() - .5) * 160;
    const dist  = 70 + Math.random() * 110;
    const dx    = (Math.cos(angle * Math.PI / 180) * dist).toFixed(1);
    const dy    = (Math.sin(angle * Math.PI / 180) * dist).toFixed(1);
    const srot  = (Math.random() * 360 - 180).toFixed(0);
    el.style.cssText =
      `left:${ox - 10}px; top:${oy - 10}px;` +
      `--sdx:${dx}px; --sdy:${dy}px; --srot:${srot}deg;` +
      `font-size:${fs}rem; animation-duration:${dur}ms; animation-delay:${del}ms;`;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  // Left side — 2 coins + 3 sparks
  arc(lx, ly, coinPool[0], 'coin-particle', -1, (1.4 + Math.random()*.8).toFixed(2), 1300 + Math.random()*500, 0);
  arc(lx, ly, coinPool[1], 'coin-particle', -1, (1.4 + Math.random()*.8).toFixed(2), 1300 + Math.random()*500, 90);
  for (let i = 0; i < 3; i++)
    spark(lx, ly, sparkPool[i], -1, (.9+Math.random()*.9).toFixed(2), 1100+Math.random()*600, Math.round(Math.random()*180));

  // Right side — 2 coins + 3 sparks
  arc(rx, ry, coinPool[0], 'coin-particle', +1, (1.4 + Math.random()*.8).toFixed(2), 1300 + Math.random()*500, 30);
  arc(rx, ry, coinPool[1], 'coin-particle', +1, (1.4 + Math.random()*.8).toFixed(2), 1300 + Math.random()*500, 120);
  for (let i = 0; i < 3; i++)
    spark(rx, ry, sparkPool[i+3], +1, (.9+Math.random()*.9).toFixed(2), 1100+Math.random()*600, Math.round(Math.random()*180));

  // One large face emoji — from whichever side has more vertical room, flying further out
  const side = Math.random() < .5 ? {x: lx, d: -1} : {x: rx, d: +1};
  arc(side.x, Math.min(ly, ry), celebEmoji, 'coin-particle', side.d,
    (3.8 + Math.random()*.8).toFixed(2), 1800 + Math.random()*400, 60,
    '--crot:0deg;');  // keep face upright
}

/* ═══════════════════════════════════════════════════════════════
   CARD RENDERER  — generic, handles pinyin + chinese + image
═══════════════════════════════════════════════════════════════ */
function buildCardInner(cardData) {
  const parts = [];
  if (cardData.pinyin)               parts.push(`<div class="card-pinyin">${cardData.pinyin}</div>`);
  if (cardData.chinese && !cardData.img) parts.push(`<div class="card-chinese">${cardData.chinese}</div>`);
  if (cardData.img)                  parts.push(`<img class="card-img" src="${cardData.img}" alt="${cardData.chinese || ''}"
      onerror="this.outerHTML='<div class=\\'img-error\\'>图片加载失败</div>'" />`);
  return parts.join('');
}

/* ═══════════════════════════════════════════════════════════════
   BUILD ROUND
═══════════════════════════════════════════════════════════════ */
function buildRound() {
  const pack  = GAME_PACKS[currentPackIdx];
  const level = pack.levels[currentLevel];
  currentPairs = level.pairs;
  leftOrder    = shuffle([...Array(currentPairs.length).keys()]);
  rightOrder   = shuffle([...Array(currentPairs.length).keys()]);
  connections  = {};
  wrongPairs   = new Set();
  levelWrong   = 0;
  selectedLeft  = null;
  selectedRight = null;
  drawingLine   = null;
  matchStartTime = null;
  levelStartTime = 0;
  levelCoins     = 0;
  document.getElementById('level-complete-bar').style.display = 'none';
  const clk = document.getElementById('clock-display');
  if (clk) { clk.textContent = '0s'; clk.classList.remove('ticking'); clk.classList.add('muted'); }
  renderColumns();
  clearSVG();
  updateLevelBadge();
  updateRoundInfo();
  updateScoreboard();
  updateAttribution();
}

function renderColumns() {
  const colL = document.getElementById('col-left');
  const colR = document.getElementById('col-right');
  colL.innerHTML = '';
  colR.innerHTML = '';

  leftOrder.forEach(pairIdx => {
    const pair = currentPairs[pairIdx];
    const card = document.createElement('div');
    card.className = 'match-card left-card';
    card.dataset.pairIdx = pairIdx;
    card.innerHTML = `
      <div class="card-row">
        <div class="card-content">${buildCardInner(pair.left)}</div>
        <div class="dot-right" id="dot-left-${pairIdx}"></div>
      </div>`;
    card.addEventListener('pointerdown', e => onLeftDown(e, pairIdx));
    colL.appendChild(card);
  });

  rightOrder.forEach(pairIdx => {
    const pair = currentPairs[pairIdx];
    const card = document.createElement('div');
    card.className = 'match-card right-card';
    card.dataset.pairIdx = pairIdx;
    card.innerHTML = `
      <div class="card-row">
        <div class="dot-left" id="dot-right-${pairIdx}"></div>
        <div class="card-content">${buildCardInner(pair.right)}</div>
      </div>`;
    card.addEventListener('pointerdown', e => onRightDown(e, pairIdx));
    colR.appendChild(card);
  });
}

/* ═══════════════════════════════════════════════════════════════
   SVG LINE HELPERS
═══════════════════════════════════════════════════════════════ */
function clearSVG() { document.getElementById('line-canvas').innerHTML = ''; }

function makeLine(cls) {
  const svg  = document.getElementById('line-canvas');
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  line.setAttribute('class', `connector-line ${cls}`);
  svg.appendChild(line);
  return line;
}

function setLinePath(lineEl, x1, y1, x2, y2) {
  const mx = (x1 + x2) / 2;
  lineEl.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
}

function removeDrawingLine() {
  if (drawingLine) { drawingLine.remove(); drawingLine = null; }
}

/* ═══════════════════════════════════════════════════════════════
   INTERACTION — Left card (drag or tap)
═══════════════════════════════════════════════════════════════ */
function onLeftDown(e, pairIdx) {
  e.preventDefault();
  if (connections[pairIdx] !== undefined) return;

  // Complete a right→left tap-tap connection
  if (selectedRight !== null) {
    const rightPairIdx = selectedRight;
    clearRightSelection();
    removeDrawingLine();
    attemptConnect(pairIdx, rightPairIdx, pairIdx === rightPairIdx);
    return;
  }

  if (selectedLeft === pairIdx) { clearLeftSelection(); removeDrawingLine(); return; }

  clearLeftSelection();
  removeDrawingLine();

  selectedLeft  = pairIdx;
  matchStartTime = Date.now();
  if (!_tickStarted) startTick();
  document.querySelector(`.left-card[data-pair-idx="${pairIdx}"]`).classList.add('selected');

  const dot    = document.getElementById(`dot-left-${pairIdx}`);
  const origin = getDotCenter(dot);
  drawingLine  = makeLine('line-pending');
  setLinePath(drawingLine, origin.x, origin.y, origin.x, origin.y);

  const startX = e.clientX, startY = e.clientY;
  let isDrag = false;
  let rafId = null;
  let cachedWr = document.getElementById('game-wrapper').getBoundingClientRect();

  function onMove(ev) {
    if (!drawingLine) return;
    if (!isDrag && (Math.abs(ev.clientX - startX) > 8 || Math.abs(ev.clientY - startY) > 8)) isDrag = true;
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
      rafId = null;
      if (drawingLine) setLinePath(drawingLine, origin.x, origin.y, ev.clientX - cachedWr.left, ev.clientY - cachedWr.top);
    });
  }

  function onUp(ev) {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup',   onUp);
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }

    const el        = document.elementFromPoint(ev.clientX, ev.clientY);
    const rightCard = el && el.closest('.right-card');

    if (rightCard && selectedLeft !== null) {
      const rightPairIdx = parseInt(rightCard.dataset.pairIdx);
      if (connections[rightPairIdx] === undefined) {
        const leftPairIdx = selectedLeft;
        clearLeftSelection();
        removeDrawingLine();
        attemptConnect(leftPairIdx, rightPairIdx, leftPairIdx === rightPairIdx);
        return;
      }
    }

    removeDrawingLine();
    if (isDrag) clearLeftSelection();
  }

  window.addEventListener('pointermove', onMove, { passive: true });
  window.addEventListener('pointerup',   onUp);
}

/* ═══════════════════════════════════════════════════════════════
   INTERACTION — Right card (tap-tap mode)
═══════════════════════════════════════════════════════════════ */
function onRightDown(e, rightPairIdx) {
  e.preventDefault();
  if (connections[rightPairIdx] !== undefined) return;

  // Complete a left→right tap-tap connection
  if (selectedLeft !== null) {
    const leftPairIdx = selectedLeft;
    clearLeftSelection();
    removeDrawingLine();
    attemptConnect(leftPairIdx, rightPairIdx, leftPairIdx === rightPairIdx);
    return;
  }

  // Toggle right selection off
  if (selectedRight === rightPairIdx) { clearRightSelection(); removeDrawingLine(); return; }

  clearRightSelection();
  removeDrawingLine();

  selectedRight  = rightPairIdx;
  matchStartTime  = Date.now();
  if (!_tickStarted) startTick();
  document.querySelector(`.right-card[data-pair-idx="${rightPairIdx}"]`).classList.add('selected');

  const dot    = document.getElementById(`dot-right-${rightPairIdx}`);
  const origin = getDotCenter(dot);
  drawingLine  = makeLine('line-pending');
  setLinePath(drawingLine, origin.x, origin.y, origin.x, origin.y);

  const startX = e.clientX, startY = e.clientY;
  let isDrag = false;
  let rafId = null;
  let cachedWr = document.getElementById('game-wrapper').getBoundingClientRect();

  function onMove(ev) {
    if (!drawingLine) return;
    if (!isDrag && (Math.abs(ev.clientX - startX) > 8 || Math.abs(ev.clientY - startY) > 8)) isDrag = true;
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
      rafId = null;
      if (drawingLine) setLinePath(drawingLine, ev.clientX - cachedWr.left, ev.clientY - cachedWr.top, origin.x, origin.y);
    });
  }

  function onUp(ev) {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup',   onUp);
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }

    const el       = document.elementFromPoint(ev.clientX, ev.clientY);
    const leftCard = el && el.closest('.left-card');

    if (leftCard && selectedRight !== null) {
      const leftPairIdx = parseInt(leftCard.dataset.pairIdx);
      if (connections[leftPairIdx] === undefined) {
        const rPairIdx = selectedRight;
        clearRightSelection();
        removeDrawingLine();
        attemptConnect(leftPairIdx, rightPairIdx, leftPairIdx === rPairIdx);
        return;
      }
    }

    removeDrawingLine();
    if (isDrag) clearRightSelection();
  }

  window.addEventListener('pointermove', onMove, { passive: true });
  window.addEventListener('pointerup',   onUp);
}

function clearLeftSelection() {
  if (selectedLeft !== null) {
    const card = document.querySelector(`.left-card[data-pair-idx="${selectedLeft}"]`);
    if (card) card.classList.remove('selected');
    selectedLeft = null;
  }
}

function clearRightSelection() {
  if (selectedRight !== null) {
    const card = document.querySelector(`.right-card[data-pair-idx="${selectedRight}"]`);
    if (card) card.classList.remove('selected');
    selectedRight = null;
  }
}

/* ═══════════════════════════════════════════════════════════════
   CONNECTION LOGIC
═══════════════════════════════════════════════════════════════ */
function attemptConnect(leftPairIdx, rightPairIdx, correct) {
  const leftDot  = document.getElementById(`dot-left-${leftPairIdx}`);
  const rightDot = document.getElementById(`dot-right-${rightPairIdx}`);
  const p1 = getDotCenter(leftDot);
  const p2 = getDotCenter(rightDot);
  const elapsedMs = matchStartTime ? Date.now() - matchStartTime : 0;
  matchStartTime  = null;

  if (correct) {
    connections[leftPairIdx] = rightPairIdx;
    levelCoins++;
    const line = makeLine('line-correct');
    setLinePath(line, p1.x, p1.y, p2.x, p2.y);
    // Spawn coins at screen midpoint of the connection
    if (celebrationOn) {
      const wr = document.getElementById('game-wrapper').getBoundingClientRect();
      const CELEB_POOL = ['🎉', '🥳', '😄', '😀', '😎', '🤩', '🙃', '😜'];
      const celebEmoji = CELEB_POOL[Math.floor(Math.random() * CELEB_POOL.length)];
      spawnCoins(wr.left + p1.x, wr.top + p1.y, wr.left + p2.x, wr.top + p2.y, celebEmoji);
    }
    document.querySelector(`.left-card[data-pair-idx="${leftPairIdx}"]`).classList.add('matched');
    document.querySelector(`.right-card[data-pair-idx="${rightPairIdx}"]`).classList.add('matched');
    showFeedback(true, currentPairs[leftPairIdx], elapsedMs);
    playCorrect();
    updateScoreboard();
    if (Object.keys(connections).length === currentPairs.length) setTimeout(showRoundComplete, 950);
  } else {
    levelWrong++;
    const key = `${leftPairIdx}-${rightPairIdx}`;
    if (!wrongPairs.has(key)) {
      wrongPairs.add(key);
      const line = makeLine('line-wrong');
      setLinePath(line, p1.x, p1.y, p2.x, p2.y);
      line.classList.add('line-flash');
      setTimeout(() => line.remove(), 900);
    }
    [['left-card', leftPairIdx], ['right-card', rightPairIdx]].forEach(([cls, idx]) => {
      const c = document.querySelector(`.${cls}[data-pair-idx="${idx}"]`);
      if (c) { c.classList.add('wrong'); setTimeout(() => c.classList.remove('wrong'), 400); }
    });
    showFeedback(false, null, 0);
    playWrong();
    updateScoreboard();
  }
}

/* ═══════════════════════════════════════════════════════════════
   FEEDBACK
═══════════════════════════════════════════════════════════════ */
function showFeedback(correct, pair = null, elapsedMs = 0) {
  clearTimeout(feedbackTimer);
  const fb = document.getElementById('feedback');

  const CORRECT_MSGS = [
    'Correct! 正确！', 'Nice! 好棒！', 'Great! 太棒！',
    'Perfect! 完美！', 'Awesome! 厉害！', 'Brilliant! 真聪明！'
  ];

  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  document.getElementById('fb-emoji').textContent = correct ? '' : '❌';
  document.getElementById('fb-msg').textContent   = correct ? pick(CORRECT_MSGS) : 'Try again! 再试试！';

  if (correct && pair) {
    const l = pair.left, r = pair.right;
    const imgSrc = l.img || r.img || null;
    const fbImg  = document.getElementById('fb-img');
    const fbName = document.getElementById('fb-name');
    const fbSubEl = document.getElementById('fb-sub');
    const pack = GAME_PACKS[currentPackIdx];

    // Celebration emoji is launched as a particle — hide it from the popup
    document.getElementById('fb-emoji').style.display = 'none';
    if (imgSrc) {
      fbImg.src = imgSrc;
      fbImg.alt = l.chinese || r.chinese || '';
      fbImg.style.display = 'block';
      fbImg.style.animation = 'none';
      fbImg.offsetWidth;
      fbImg.style.animation = '';
    } else {
      fbImg.style.display = 'none';
    }

    if (pack.id === 'strokes') {
      // Show "横 (héng)" above the image, hide sub
      const chinese = l.chinese || '';
      const pinyin  = l.pinyin  || '';
      fbName.innerHTML = `<span class="fb-pinyin">(${pinyin})</span><br>${chinese}`;
      fbName.style.display = 'block';
      fbSubEl.textContent = '';
      fbSubEl.classList.remove('zh-phrase');
    } else if (pack.id === 'measure' && l.chinese && r.chinese) {
      fbName.style.display = 'none';
      fbSubEl.textContent = `一${l.chinese}${r.chinese}`;
      fbSubEl.classList.add('zh-phrase');
    } else {
      fbName.style.display = 'none';
      const lStr = [l.pinyin, l.chinese].filter(Boolean).join(' ');
      const rStr = [r.pinyin, r.chinese].filter(Boolean).join(' ');
      fbSubEl.textContent = `${lStr}  ↔  ${rStr}`;
      fbSubEl.classList.remove('zh-phrase');
    }
  } else {
    document.getElementById('fb-img').style.display = 'none';
    document.getElementById('fb-emoji').style.display = '';
    document.getElementById('fb-name').style.display = 'none';
    const fbSubEl = document.getElementById('fb-sub');
    fbSubEl.classList.remove('zh-phrase');
    fbSubEl.textContent = "That doesn't match — try a different pair.";
  }

  // Per-match timer badge
  const fbTimer = document.getElementById('fb-timer');
  if (correct && elapsedMs > 0) {
    fbTimer.textContent = `⏱ ${(elapsedMs / 1000).toFixed(1)}s`;
    fbTimer.style.display = '';
  } else {
    fbTimer.style.display = 'none';
  }

  fb.classList.add('show');

  // Dismiss on the very next pointer event anywhere on the page
  const dismiss = () => {
    clearTimeout(feedbackTimer);
    fb.classList.remove('show');
  };
  feedbackTimer = setTimeout(dismiss, correct ? 1400 : 1200);
  document.addEventListener('pointerdown', dismiss, { once: true, capture: true });
}

/* ═══════════════════════════════════════════════════════════════
   SCOREBOARD / PROGRESS
═══════════════════════════════════════════════════════════════ */
function updateScoreboard() {
  const matched = Object.keys(connections).length;
  document.getElementById('score-correct').textContent = matched;
  document.getElementById('score-total').textContent   = currentPairs.length;
  document.getElementById('score-wrong').textContent   = levelWrong;

  const pack        = GAME_PACKS[currentPackIdx];
  const totalPairs  = pack.levels.reduce((s, l) => s + l.pairs.length, 0);
  const doneBefore  = pack.levels.slice(0, currentLevel).reduce((s, l) => s + l.pairs.length, 0);
  const pct         = Math.round((doneBefore + matched) / totalPairs * 100);
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateLevelBadge() {
  const pack  = GAME_PACKS[currentPackIdx];
  const lv    = pack.levels[currentLevel];
  const total = pack.levels.length;
  const badge = document.getElementById('level-badge');
  badge.textContent = `${lv.shortLabel} of ${total}`;
  badge.className   = `level-badge ${lv.cls}`;
}

function updateRoundInfo() {
  const lv  = GAME_PACKS[currentPackIdx].levels[currentLevel];
  document.getElementById('round-info').textContent =
    `${lv.label} — match all ${currentPairs.length} pairs to advance`;
}

function updateAttribution() {
  const pack   = GAME_PACKS[currentPackIdx];
  const footer = document.getElementById('attr-img');
  footer.style.display = pack.attribution ? 'block' : 'none';
  if (pack.attribution) footer.innerHTML = pack.attribution;

  // Update page title
  document.getElementById('app-title').textContent =
    `${pack.icon} ${pack.nameCN} — ${pack.name}`;
}

/* ═══════════════════════════════════════════════════════════════
   LEVEL COMPLETE
═══════════════════════════════════════════════════════════════ */
function showRoundComplete() {
  const pack    = GAME_PACKS[currentPackIdx];
  const isLast  = currentLevel === pack.levels.length - 1;
  const matched = Object.keys(connections).length;
  const attempts = matched + levelWrong;
  const accuracy = attempts === 0 ? 100 : Math.round(matched / attempts * 100);
  const stars    = levelWrong === 0 ? '⭐⭐⭐' : levelWrong <= 2 ? '⭐⭐' : '⭐';

  document.getElementById('co-emoji').textContent = isLast ? '🏆' : '🎉';
  document.getElementById('co-stars').textContent = stars;
  document.getElementById('co-title').textContent = isLast ? '全部完成！All Done!' : '太棒了！Great job!';

  const totalSecs = ((Date.now() - levelStartTime) / 1000).toFixed(1);
  const nextLv = !isLast ? pack.levels[currentLevel + 1] : null;
  document.getElementById('co-stats').textContent = isLast
    ? `All ${matched} pairs mastered! 🎊  ⏱ ${totalSecs}s`
    : `Accuracy: ${accuracy}%  |  Mistakes: ${levelWrong}  |  ⏱ ${totalSecs}s`;
  // Show coin + time summary in top header
  const bar = document.getElementById('level-complete-bar');
  bar.innerHTML = `🪙 ${levelCoins} coin${levelCoins !== 1 ? 's' : ''} collected &nbsp;·&nbsp; ⏱ ${totalSecs}s total`;
  bar.style.display = '';

  const btn = document.getElementById('co-btn');
  if (isLast) {
    btn.textContent = '🔄 Play Again';
    btn.onclick = resetAll;
  } else {
    btn.textContent = `▶ Level ${currentLevel + 2}`;
    btn.onclick = nextLevel;
  }

  document.getElementById('complete-overlay').classList.add('show');
  stopTick();
  playComplete();
}

/* ═══════════════════════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════════════════════ */
function nextLevel() {
  document.getElementById('complete-overlay').classList.remove('show');
  currentLevel++;
  const pack = GAME_PACKS[currentPackIdx];
  if (currentLevel >= pack.levels.length) { resetAll(); return; }
  buildRound();
}

function retryLevel() {
  clearSVG();
  leftOrder    = shuffle([...Array(currentPairs.length).keys()]);
  rightOrder   = shuffle([...Array(currentPairs.length).keys()]);
  connections  = {};
  wrongPairs   = new Set();
  levelWrong   = 0;
  selectedLeft  = null;
  selectedRight = null;
  matchStartTime = null;
  levelStartTime = 0;
  levelCoins     = 0;
  document.getElementById('level-complete-bar').style.display = 'none';
  const clk = document.getElementById('clock-display');
  if (clk) { clk.textContent = '0s'; clk.classList.remove('ticking'); clk.classList.add('muted'); }
  renderColumns();
  updateRoundInfo();
  updateScoreboard();
}

function resetAll() {
  document.getElementById('complete-overlay').classList.remove('show');
  stopTick();
  currentLevel = 0;
  levelWrong   = 0;
  buildRound();
}

/* ═══════════════════════════════════════════════════════════════
   GAME SELECTOR
═══════════════════════════════════════════════════════════════ */
function openSelector() {
  const list = document.getElementById('pack-list');
  list.innerHTML = '';
  GAME_PACKS.forEach((pack, idx) => {
    const item = document.createElement('div');
    item.className = 'pack-item' + (idx === currentPackIdx ? ' active-pack' : '');
    item.innerHTML = `
      <div class="pack-icon">${pack.icon}</div>
      <div class="pack-info">
        <div class="pack-name">${pack.nameCN} &nbsp; ${pack.name}</div>
        <div class="pack-desc">${pack.desc}</div>
        <div class="pack-levels">${pack.levels.length} level${pack.levels.length > 1 ? 's' : ''} &nbsp;·&nbsp;
          ${pack.levels.reduce((s, l) => s + l.pairs.length, 0)} pairs total</div>
      </div>`;
    item.addEventListener('click', () => loadPack(idx));
    list.appendChild(item);
  });
  document.getElementById('selector-overlay').classList.add('show');
}

function closeSelector() {
  document.getElementById('selector-overlay').classList.remove('show');
}

function loadPack(idx) {
  currentPackIdx = idx;
  currentLevel   = 0;
  closeSelector();
  buildRound();
}

/* ═══════════════════════════════════════════════════════════════
   HELP
═══════════════════════════════════════════════════════════════ */
function toggleCelebration() {
  celebrationOn = !celebrationOn;
  document.getElementById('celeb-track').classList.toggle('on', celebrationOn);
}

function toggleHelp() {
  alert(
    '📖 HOW TO PLAY\n\n' +
    '1. Tap / click an item on the LEFT side.\n' +
    '2. Drag (or tap) to its matching item on the RIGHT.\n' +
    '3. A green line = correct match ✅\n' +
    '   A red flash  = wrong pair ❌\n' +
    '4. Match all pairs to finish the round!\n' +
    '5. Use "Switch Game" to choose a different category.\n\n' +
    '玩法说明：\n' +
    '点击左侧选项，拖线连到右侧对应答案。\n' +
    '绿线表示正确，红色闪烁表示错误。\n' +
    '全部连对即可过关！\n' +
    '点击"Switch Game"切换不同练习主题。'
  );
}

/* ═══════════════════════════════════════════════════════════════
   RESIZE — redraw lines
═══════════════════════════════════════════════════════════════ */
window.addEventListener('resize', () => {
  clearSVG();
  Object.entries(connections).forEach(([leftPairIdx, rightPairIdx]) => {
    const ld = document.getElementById(`dot-left-${leftPairIdx}`);
    const rd = document.getElementById(`dot-right-${rightPairIdx}`);
    if (ld && rd) {
      const line = makeLine('line-correct');
      setLinePath(line, ...Object.values(getDotCenter(ld)), ...Object.values(getDotCenter(rd)));
    }
  });
});

/* ═══════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════ */
// Set scoreboard coin icon based on platform
document.getElementById('score-coin-icon').textContent = isIOS ? '⭐' : '🪙';
document.getElementById('clock-display').addEventListener('click', toggleTickMute);
buildRound();
</script>
